<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zenvora</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Hind:wght@400;500;600&family=Noto+Nastaliq+Urdu:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --soft:#F5F7F3; --ink:#1B2220; --muted:#5C6964; --line:#D7DDD7;
  --khata:#8B1E2E; --khata-2:#6E1724; --khata-ink:#FFF4EE; --haldi:#E2A01B; --haldi-ink:#2A1A00;
  --green:#1E7651; --red:#B3261E; --focus:#2457C5;
  --txt:"Hind",system-ui,-apple-system,"Segoe UI",sans-serif;
  --disp:"Bricolage Grotesque","Hind",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[lang="ur"]{ --txt:"Noto Nastaliq Urdu","Noto Naskh Arabic","Geeza Pro",serif; --disp:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif; }
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111513; --surface:#1A1F1D; --soft:#161B19; --ink:#E8EDE9; --muted:#9BA7A2; --line:#2B3330;
    --khata:#741826; --khata-2:#5A111D; --khata-ink:#FFEDE5; --haldi:#F0B43A; --haldi-ink:#231500;
    --green:#4FC18E; --red:#F2786E; --focus:#8FB0FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#111513; --surface:#1A1F1D; --soft:#161B19; --ink:#E8EDE9; --muted:#9BA7A2; --line:#2B3330;
  --khata:#741826; --khata-2:#5A111D; --khata-ink:#FFEDE5; --haldi:#F0B43A; --haldi-ink:#231500;
  --green:#4FC18E; --red:#F2786E; --focus:#8FB0FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--txt);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
:root[lang="ur"] body{font-size:15px;line-height:2}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:8px}
.n{font-family:"Bricolage Grotesque","Hind",system-ui,sans-serif;font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}

.wrap{max-width:520px;margin:0 auto;padding:0 16px 120px}
@media (min-width:1000px){
  .wrap{max-width:1120px;padding:0 28px 120px}
  .hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
  .hcol>h2:first-child,.hcol>.alert:first-child{margin-top:0}
  .hcol>.udcard:first-child{margin-top:0}
  #view:not([data-tab="home"]){max-width:760px;margin:0 auto}
  .acrow{flex-wrap:wrap;overflow:visible}
  .actiles{grid-template-columns:repeat(3,minmax(0,1fr))}
  body .bcard{flex:1 1 calc(50% - 6px);max-width:none}
  nav.tabs .in{max-width:640px}
  body .khata .big{font-size:3.4rem}
}
@media (min-width:700px){
  body .sheet{left:50%;right:auto;width:580px;transform:translate(-50%,105%);border-radius:22px 22px 0 0}
  body .sheet.open{transform:translate(-50%,0)}
  button,[role="button"]{cursor:pointer}
}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0 10px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-family:var(--disp);font-weight:800;font-size:1.25rem;letter-spacing:-.01em;line-height:1.3}
:root[lang="ur"] .brand{font-weight:600;font-size:1.2rem;letter-spacing:0}
.brandwrap{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:44px;height:44px;flex:none;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.langbtn{display:block;white-space:nowrap;border:0;background:none;padding:2px 0;font-family:var(--txt);font-weight:600;font-size:.8rem;color:var(--muted);letter-spacing:0}
.monthsw{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px;flex:none}
.monthsw button{border:0;background:none;width:36px;height:36px;border-radius:50%;font-size:1.2rem;line-height:1}
.monthsw button:active{background:var(--soft)}
.monthsw span{font-weight:600;font-size:.86rem;min-width:100px;text-align:center}
.monthsw .mlabel{width:auto;min-width:100px;height:36px;border-radius:99px;padding:0 6px;font-weight:600;font-size:.86rem;line-height:1.2}
.yearbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.yearbar button{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:50%;font-size:1.2rem}
.yearbar b{font-family:"Bricolage Grotesque",sans-serif;font-size:1.25rem}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mgrid button{border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:600;min-height:64px;justify-content:center}
.mgrid button small{font-family:"Bricolage Grotesque",sans-serif;font-size:.74rem;font-weight:500;color:var(--muted);direction:ltr}
.mgrid button.now{border-color:var(--haldi)}
.mgrid button[aria-pressed="true"]{background:var(--khata);border-color:var(--khata);color:var(--khata-ink)}
.mgrid button[aria-pressed="true"] small{color:inherit;opacity:.85}
.sync{font-size:.8rem;color:var(--muted);margin:-4px 0 8px;min-height:1.2em}

.khata{position:relative;background:var(--khata);color:var(--khata-ink);border-radius:22px;padding:22px 20px 18px;padding-inline-start:40px;overflow:hidden}
.khata::before{content:"";position:absolute;top:0;bottom:0;inset-inline-start:22px;width:6px;border-left:2px solid var(--haldi);border-right:2px solid var(--haldi);opacity:.85}
.khata::after{content:none}
.khata .lbl{font-size:.95rem;opacity:.85}
.khata .big{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(2.4rem,11vw,3.3rem);line-height:1.05;letter-spacing:-.02em;margin:2px 0 14px;font-variant-numeric:tabular-nums;direction:ltr;text-align:start}
:root[lang="ur"] .khata .big{text-align:end}
.khata .big.neg{color:#FFC2B8}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;position:relative;z-index:1}
.trio div{background:var(--khata-2);border-radius:12px;padding:8px 10px}
.trio b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1rem;font-variant-numeric:tabular-nums}
.trio span{font-size:.78rem;opacity:.8}
.meter{position:relative;z-index:1;margin-top:14px;height:8px;background:rgba(255,255,255,.15);border-radius:99px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--haldi);border-radius:99px;transition:width .4s ease}
.meter-note{position:relative;z-index:1;font-size:.8rem;opacity:.85;margin-top:6px}
.khata{background:#1C1C1E;color:#F5F2EA;box-shadow:0 0 0 1px #3A3324 inset}
.khata::before{border-left-color:#D4A537;border-right-color:#D4A537}
.khata .big{color:#E8C16A}
.khata .big.neg{color:#FF9B8F}
.khata .trio div{background:#2C2C2E}
.khata .trio b{color:#F5F2EA;white-space:nowrap;font-size:clamp(.8rem,3.5vw,1rem)}
.khata .meter i{background:#D4A537}

.savecard{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:end}
.savecard .t{font-weight:600;font-size:.92rem}
.savecard .v{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.6rem;line-height:1.1;color:var(--green);font-variant-numeric:tabular-nums}
.savecard .s{grid-column:1/-1;font-size:.82rem;color:var(--muted)}
.savecard .bar{grid-column:1/-1;margin-top:6px}
.end{text-align:end}
.lock{position:fixed;inset:0;z-index:100;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(24px + env(safe-area-inset-top,0px)) 24px calc(24px + env(safe-area-inset-bottom,0px));text-align:center}
.lock[hidden]{display:none}
.lock img{width:76px;height:76px;border-radius:50%;box-shadow:0 0 0 1px var(--line)}
.lock h3{font-family:var(--disp);font-size:1.2rem;margin:14px 0 2px}
:root[lang="ur"] .lock h3{font-weight:600}
.dots{display:flex;gap:16px;margin:12px 0 4px;direction:ltr}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--khata)}
.dots i.on{background:var(--khata)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dots i{border-color:var(--haldi)} :root:not([data-theme="light"]) .dots i.on{background:var(--haldi)}}
:root[data-theme="dark"] .dots i{border-color:var(--haldi)} :root[data-theme="dark"] .dots i.on{background:var(--haldi)}
.lock .err{min-height:1.7em;color:var(--red);font-size:.9rem}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px;margin-top:8px;direction:ltr}
.pad button{width:72px;height:72px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-family:"Bricolage Grotesque",sans-serif;font-size:1.6rem;font-weight:600}
.pad button:active{background:var(--soft)}
.pad .blank{visibility:hidden}
.lock .sub{font-size:.82rem;color:var(--muted);max-width:290px;margin-top:16px}
.lock .cancel{margin-top:12px;border:0;background:none;color:var(--muted);font-weight:600;padding:8px 16px}
.shake{animation:sh .3s}
@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.pinrow{display:flex;gap:10px}
.login{position:fixed;inset:0;z-index:150;background:var(--bg);overflow:auto;display:flex;flex-direction:column;align-items:center;padding:calc(48px + env(safe-area-inset-top,0px)) 24px calc(28px + env(safe-area-inset-bottom,0px));text-align:center}
.login[hidden]{display:none}
.login .lin{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:12px;flex:1}
.login img{width:120px;height:120px;border-radius:50%;box-shadow:0 0 0 1px var(--gline),0 12px 30px rgba(0,0,0,.12)}
.login h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.4rem;margin:6px 0 0;letter-spacing:-.02em}
.login .tg{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:.75rem;letter-spacing:.12em;color:var(--haldi)}
.login .sb{color:var(--muted);max-width:300px;margin:4px 0 10px}
.login .ft{width:100%;display:flex;flex-direction:column;gap:8px;margin-bottom:auto}
.login .ft div{display:flex;align-items:center;gap:10px;background:var(--surface);border:1px solid var(--gline);border-radius:14px;padding:10px 14px;text-align:start;font-size:.92rem;font-weight:500}
.login .gbtn{width:100%;height:56px;margin-top:24px;display:flex;align-items:center;justify-content:center;gap:12px;background:#fff;color:#1B2220;border:1.5px solid #C9D0CA;border-radius:16px;font-weight:600;font-size:1.05rem;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.login .gbtn:disabled{opacity:.6}
.login .gbtn i{width:28px;height:28px;border-radius:50%;background:#F1F3F4;display:grid;place-items:center;font:700 16px "Bricolage Grotesque",sans-serif;color:#3C4043;font-style:normal}
.login .tm{font-size:.78rem;color:var(--muted);margin-top:8px}
.greet{margin:2px 2px 12px}
.greet b{display:block;font-family:var(--disp);font-size:1.02rem;font-weight:600;color:var(--muted)}
.greet .gn{font-family:var(--disp);font-size:1.45rem;font-weight:800;line-height:1.2;margin:1px 0 3px}
:root[lang="ur"] .greet b{font-weight:600}
.greet span{color:var(--muted);font-size:.88rem}
.acwrap{margin-top:12px}
.achead{display:flex;justify-content:space-between;align-items:baseline;margin:0 2px 8px}
.achead b{font-weight:600}
.achead .n{font-weight:700}
.actiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.atile{background:var(--surface);border:1px solid var(--gline);border-radius:14px;padding:11px 12px;text-align:start;display:flex;flex-direction:column;gap:2px;min-width:0}
.atile .al{display:flex;align-items:center;gap:6px;font-size:.8rem;color:var(--muted);font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atile .ad{width:8px;height:8px;border-radius:50%;flex:none}
.atile b{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.12rem;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;text-align:start}
:root[lang="ur"] .atile b{text-align:end}
.atile small{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acrow{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;scrollbar-width:none}
.acrow::-webkit-scrollbar{display:none}
.bcard{flex:0 0 78%;max-width:300px;scroll-snap-align:start;border-radius:18px;padding:16px 16px 14px;color:#fff;position:relative;overflow:hidden;min-height:132px;display:flex;flex-direction:column;justify-content:space-between;border:0;text-align:start;box-shadow:0 6px 16px rgba(0,0,0,.12)}
.bcard::after{content:"";position:absolute;width:160px;height:160px;border-radius:50%;right:-50px;top:-60px;background:rgba(255,255,255,.08)}
.bcard .bk{display:flex;align-items:center;gap:8px;font-weight:600;font-size:.95rem;position:relative;z-index:1}
.bcard .bk small{display:block;font-weight:500;opacity:.8;font-size:.75rem}
.bcard .bv{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.55rem;position:relative;z-index:1;direction:ltr;text-align:start}
:root[lang="ur"] .bcard .bv{text-align:end}
.bcard .bs{font-size:.78rem;opacity:.85;position:relative;z-index:1}
.bcard .chip2{position:absolute;right:16px;bottom:16px;width:34px;height:24px;border-radius:5px;background:linear-gradient(135deg,#E8C16A,#B8892B);opacity:.9;z-index:1}
.donut{display:flex;align-items:center;gap:16px;padding:14px}
.donut svg{flex:none}
.dleg{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.dleg div{display:flex;align-items:center;gap:8px;font-size:.88rem}
.dleg i{width:10px;height:10px;border-radius:3px;flex:none}
.dleg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dleg b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;white-space:nowrap;direction:ltr}
.dleg em{font-style:normal;color:var(--muted);font-size:.78rem;width:34px;text-align:end}
.aibtn.mic{background:var(--surface);color:var(--ink);border:1.5px solid var(--gline)}
.aibtn.mic.on{background:#B3261E;color:#fff;border-color:#B3261E;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(179,38,30,.2)}}
.hdr-r{display:flex;align-items:center;gap:6px;flex:none}
.brandwrap>div{min-width:0}
.langbtn{max-width:100%;overflow:hidden;text-overflow:ellipsis}
.bell{position:relative;width:40px;height:40px;border-radius:50%;border:1px solid var(--gline);background:var(--surface);color:var(--ink);display:grid;place-items:center;padding:0;flex:none}
.bell.has{color:var(--khata)}
.bbadge{position:absolute;top:-4px;inset-inline-end:-4px;min-width:18px;height:18px;border-radius:9px;background:#B3261E;color:#fff;font:700 11px/18px "Bricolage Grotesque",sans-serif;padding:0 5px;text-align:center}
.monthsw button{width:32px!important}
.monthsw .mlabel{width:auto!important;min-width:78px!important}
.alert.mz{background:#E6F4EC;border-color:#9ED3B8;color:#14543A}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alert.mz{background:#12301F;border-color:#2F6B4A;color:#BDE8CF}}
:root[data-theme="dark"] .alert.mz{background:#12301F;border-color:#2F6B4A;color:#BDE8CF}
.alert .paybtn+.paybtn{margin-inline-start:-4px}
.alert{display:flex;align-items:center;gap:12px;border-radius:16px;padding:11px 12px 11px 14px;margin-bottom:10px;border:1px solid}
.alert.soon{background:#FDF3DC;border-color:#E9C46A;color:#5A3E00}
.alert.late{background:#FBE5E3;border-color:#E7A39D;color:#7A1C15}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .alert.soon{background:#3A2E12;border-color:#7A5E1E;color:#F7DFA3} :root:not([data-theme="light"]) .alert.late{background:#3D1A18;border-color:#7E3530;color:#F7C2BD}}
:root[data-theme="dark"] .alert.soon{background:#3A2E12;border-color:#7A5E1E;color:#F7DFA3} :root[data-theme="dark"] .alert.late{background:#3D1A18;border-color:#7E3530;color:#F7C2BD}
.alert .mid b{white-space:normal}
.alert .mid small{color:inherit;opacity:.85}
.alert .paybtn{border-color:currentColor!important;background:transparent;color:inherit}
nav.tabs button{position:relative}
.nbadge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:#B3261E;color:#fff;font-size:11px;font-weight:700;line-height:18px;padding:0 5px;font-family:"Bricolage Grotesque",sans-serif}
.sheetx{position:absolute;top:10px;inset-inline-end:12px;z-index:2;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:1rem;line-height:1}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line)!important;background:var(--surface)!important;border-radius:99px;padding:6px 14px!important;color:var(--ink)!important}
.cursel{flex:none;border:0;background:var(--soft);border-radius:8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--muted);font-size:1rem;padding:6px 4px;max-width:92px}
.conv{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--green);margin-top:6px;direction:ltr;text-align:start}
.sbox{position:relative;margin-top:12px}
.sbox input{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 40px 12px 40px}
.sbox .si{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);pointer-events:none;opacity:.6}
.sbox .sx{position:absolute;inset-inline-end:6px;top:50%;transform:translateY(-50%);border:0;background:none;width:32px;height:32px;border-radius:50%;color:var(--muted);font-size:1rem}
mark{background:color-mix(in srgb,var(--haldi) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:12px}
.gtop{display:flex;align-items:center;gap:12px}
.gtop .pct{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.2rem;color:var(--green)}
.gamt{display:flex;justify-content:space-between;font-size:.85rem;color:var(--muted);margin-top:6px}
.gnote{font-size:.82rem;color:var(--muted);margin-top:6px}
.gbtns{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:10px}
.gbtns .btn{padding:10px 12px;font-size:.92rem}
.bar.big{height:10px}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;margin-top:14px}
.rgrid .field{min-width:0}
.rgrid input[type=date]{min-width:0;width:100%;padding:10px 8px}
.emogrid{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.emogrid button{aspect-ratio:1;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-size:1.2rem;padding:0}
.emogrid button[aria-pressed="true"]{border-color:var(--khata);background:var(--soft);box-shadow:0 0 0 2px var(--khata) inset}
.row.dim{opacity:.55}
.rp{position:fixed;left:-12000px;top:0;width:794px;background:#fff;color:#1B2220;padding:0 40px 8px;font-family:var(--txt);font-size:13px;line-height:1.5}
:root[lang="ur"] .rp{line-height:2}
.rp .rh{display:flex;align-items:center;gap:14px;padding:6px 0 14px;border-bottom:3px solid #8B1E2E}
.rp .rh img{width:56px;height:56px;border-radius:50%;box-shadow:0 0 0 1px #D7DDD7}
.rp .rh h1{font-family:"Bricolage Grotesque",sans-serif;font-size:26px;margin:0;line-height:1.1}
.rp .rh .sub{color:#5C6964;font-size:14px}
.rp .rh .dt{margin-inline-start:auto;color:#5C6964;font-size:12px;text-align:end}
.rp h3{font-family:var(--disp);font-size:16px;margin:20px 0 8px;color:#8B1E2E}
.rp .sg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:16px}
.rp .sg div{border:1px solid #D7DDD7;border-radius:10px;padding:8px 10px}
.rp .sg span{display:block;font-size:11px;color:#5C6964}
.rp .sg b{font-family:"Bricolage Grotesque",sans-serif;font-size:16px;direction:ltr;unicode-bidi:isolate}
.rp table{width:100%;border-collapse:collapse}
.rp th{background:#F2F4F1;font-weight:600;font-size:12px;text-align:start;padding:6px 8px}
.rp td{padding:6px 8px;border-bottom:1px solid #E5E9E5;text-align:start;vertical-align:top}
.rp td.num,.rp th.num{text-align:end;white-space:nowrap;font-family:"Bricolage Grotesque",sans-serif;direction:ltr}
.rp .gr{color:#1E7651} .rp .rd{color:#B3261E}
.rp .ft{margin-top:22px;padding-top:10px;border-top:1px solid #D7DDD7;text-align:center;color:#B8860B;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;letter-spacing:.08em;font-size:11px}
.chk{display:flex;align-items:center;gap:10px;margin:14px 0 0;font-weight:600;font-size:.92rem}
.chk input{width:20px;height:20px;accent-color:var(--khata);flex:none}
.recbtns{display:flex;gap:6px;flex:none}
.recbtns button{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:600;font-size:.82rem}
.recbtns button.ok{background:var(--khata);border-color:var(--khata);color:var(--khata-ink)}
.zres{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:14px}
.zres .zr{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.zres .zbig{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:1.8rem;color:var(--green)}
.zinput{width:120px;text-align:end;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:6px 8px;flex:none}
.udcard.askcard{margin:0 0 12px;border-color:color-mix(in srgb,var(--haldi) 55%,var(--line))}
:root{--gline:color-mix(in srgb,var(--haldi) 55%,var(--line))}
.panel,.savecard,.udcard,.gcard,.zres,.monthsw,.seg,.sbox input,.btn.ghost,.langopt,.udtop div,.pcard,.chip,.paybtn,.recbtns button,.mgrid button,.yearbar button,.sheetx,.back{border-color:var(--gline)!important}
.panel,.savecard,.udcard,.gcard,.zres,.udtop div,.pcard{border-width:1px;border-style:solid}
nav.tabs{border-top-color:var(--gline)}
.chip[aria-pressed="true"],.paybtn.done,.recbtns button.ok,.mgrid button[aria-pressed="true"]{border-color:transparent!important}
.askcard .ico{background:color-mix(in srgb,var(--haldi) 22%,transparent)}
.chat{display:flex;flex-direction:column;gap:8px;max-height:50vh;overflow:auto;padding:2px}
.bub{padding:10px 12px;border-radius:14px;white-space:pre-wrap;line-height:1.55;max-width:88%;font-size:.95rem;overflow-wrap:anywhere}
.bub.me{align-self:flex-end;background:var(--khata);color:var(--khata-ink);border-end-end-radius:4px}
.bub.ai{align-self:flex-start;background:var(--soft);border:1px solid var(--line);border-end-start-radius:4px}
.bub.err{color:var(--red)}
.chat .chips .chip{text-align:start}
.udcard{margin-top:12px;width:100%;display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:12px 14px;text-align:start}
.udsum{display:flex;flex-direction:column;align-items:flex-end;gap:2px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:.9rem;white-space:nowrap;direction:ltr}
.g{color:var(--green)} .r{color:var(--red)}
.back{border:0;background:none;color:var(--muted);font-weight:600;padding:4px 0;margin:0 0 8px}
.udtop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.udtop div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px}
.udtop span{font-size:.82rem;color:var(--muted)}
.udtop b{display:block;font-family:"Bricolage Grotesque",sans-serif;font-size:1.35rem;font-variant-numeric:tabular-nums}
.udbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btn.give{background:var(--khata);color:var(--khata-ink)} .btn.get{background:var(--green);color:#fff}
.btn small{display:block;font-weight:500;font-size:.72rem;opacity:.85;line-height:1.3;margin-top:2px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;text-align:center}
.pcard h3{font-family:var(--disp);margin:0 0 4px;font-size:1.2rem}
.pcard .pb{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2rem;font-variant-numeric:tabular-nums}
.aibox{display:flex;gap:8px}
.aibox input{flex:1;min-width:0;border:1.5px dashed var(--haldi);background:var(--soft);border-radius:12px;padding:11px 12px}
.aibtn{flex:none;width:50px;border:0;border-radius:12px;background:var(--haldi);color:var(--haldi-ink);font-size:1.2rem}
.aimsg{font-size:.85rem;color:var(--muted);margin-top:6px}
.legend{display:flex;gap:16px;justify-content:center;font-size:.8rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-inline-end:6px;vertical-align:middle}
.inst{color:var(--khata)!important;font-weight:600}
.banklist{grid-column:1/-1;display:grid;gap:4px;margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:.88rem}
.banklist div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;min-height:1.6em}
.banklist div>span{min-width:0}
.banklist .pl{display:block;font-size:.76rem;line-height:1.3}
.banklist b{font-weight:700;flex:none;white-space:nowrap}
.sel{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px 12px;appearance:auto}
#bankOther{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px 12px;margin-top:8px}
.tagline{text-align:center;margin:28px 0 4px;font-family:"Bricolage Grotesque","Hind",sans-serif;font-weight:700;font-size:.78rem;letter-spacing:.08em;color:var(--haldi);direction:ltr}

h2{font-family:var(--disp);font-weight:700;font-size:1.08rem;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline}
:root[lang="ur"] h2{font-weight:600}
h2 button.link{font-family:var(--txt);font-size:.88rem;font-weight:600;color:var(--khata);background:none;border:0;padding:0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) h2 button.link{color:var(--haldi)}}
:root[data-theme="dark"] h2 button.link{color:var(--haldi)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line);background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:start}
.panel>.row:first-child{border-top:0}
.ico{width:38px;height:38px;flex:none;border-radius:12px;background:var(--soft);display:grid;place-items:center;font-size:1.15rem;border:0}
.mid{flex:1;min-width:0;border:0;background:none;padding:0;text-align:start}
.mid b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mid small{display:block;color:var(--muted);font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:root[lang="ur"] .mid b,:root[lang="ur"] .mid small{line-height:2.1}
.amt{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.amt.in{color:var(--green)} .amt.sv{color:var(--green)}
.empty{padding:22px 18px;color:var(--muted);text-align:center}

.bar{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--khata);border-radius:99px}
.bar i.over{background:var(--red)}
.bar i.bill{background:var(--haldi)}
.bar i.sav{background:var(--green)}

.pill{display:inline-block;font-size:.75rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--soft);color:var(--muted)}
.pill.due{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.pill.ok{background:color-mix(in srgb,var(--green) 14%,transparent);color:var(--green)}
.paybtn{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-weight:600;font-size:.85rem;white-space:nowrap;flex:none}
.paybtn.done{background:var(--green);border-color:var(--green);color:#fff}

.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;border-radius:9px;padding:8px 4px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--khata);color:var(--khata-ink)}
.daylbl{font-size:.82rem;color:var(--muted);font-weight:600;margin:16px 4px 6px;display:flex;justify-content:space-between}

.budget-row{padding:12px 14px;border-top:1px solid var(--line)}
.panel>.budget-row:first-child{border-top:0}
.budget-top{display:flex;align-items:center;gap:10px}
.budget-top input{width:110px;text-align:end;border:1px solid var(--line);background:var(--soft);border-radius:10px;padding:6px 8px}
.budget-meta{font-size:.8rem;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between}

.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:600;font-size:1rem;width:100%}
.btn.pri{background:var(--khata);color:var(--khata-ink)}
.btn.ghost{background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--red);border:1px solid color-mix(in srgb,var(--red) 40%,transparent)}
.hint{font-size:.85rem;color:var(--muted);margin:10px 4px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:520px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr 76px 1fr 1fr;align-items:center;height:64px}
nav.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.74rem;font-weight:600;color:var(--muted);padding:6px 0;line-height:1.4}
nav.tabs button .e{font-size:1.25rem;line-height:1.1;filter:grayscale(1);opacity:.75}
nav.tabs button[aria-current="page"]{color:var(--khata)}
nav.tabs button[aria-current="page"] .e{filter:none;opacity:1}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--haldi)}}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--haldi)}
nav.tabs .fab{justify-self:center;width:58px;height:58px;border-radius:50%;background:var(--haldi);color:var(--haldi-ink);font-size:2rem;font-weight:500;line-height:1;transform:translateY(-14px);box-shadow:0 6px 16px rgba(120,70,0,.3);display:grid;place-items:center;font-family:"Hind",sans-serif}

.scrim{position:fixed;inset:0;background:rgba(10,14,12,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:22px 22px 0 0;max-height:92vh;overflow:auto;transform:translateY(105%);transition:transform .25s ease;padding:8px 18px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.open{transform:none}
.sheet .in{max-width:520px;margin:0 auto}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h3{font-family:var(--disp);font-size:1.2rem;margin:0 0 12px}
:root[lang="ur"] .sheet h3{font-weight:600}
.field{margin:14px 0}
.field>label{display:block;font-size:.85rem;font-weight:600;color:var(--muted);margin-bottom:6px}
.field input[type=text],.field input[type=date],.field input[type=number]{width:100%;border:1px solid var(--line);background:var(--soft);border-radius:12px;padding:11px 12px}
.amtin{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--khata);padding:4px 2px;direction:ltr}
.amtin span{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--muted);font-size:1.3rem}
.amtin input{border:0;background:none;padding:0;font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:2.2rem;width:100%;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 12px;font-size:.9rem;font-weight:500}
.chip[aria-pressed="true"]{border-color:var(--khata);background:var(--khata);color:var(--khata-ink)}
.actions{display:flex;gap:10px;margin-top:18px}
.langopt{display:flex;align-items:center;justify-content:space-between;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:14px 16px;margin-bottom:10px;font-size:1.05rem;font-weight:600}
.langopt[aria-pressed="true"]{border-color:var(--khata)}
.langopt .ur{font-family:"Noto Nastaliq Urdu","Noto Naskh Arabic",serif;line-height:2}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;font-size:.92rem;opacity:0;pointer-events:none;transition:.2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>

function bankBalances(){
  const o={}, since={}; banks().forEach(b=>{ o[b.id]=+b.open||0; since[b.id]=+b.since||0; });
  const first=banks()[0]; const docs={...savDocs,['m-'+cur]:month};
  for(const k in docs){ const d=docs[k]; if(!d) continue;
    (d.tx||[]).forEach(x=>{ const ts=txTs(x); flowsOf(x).forEach(([id,v])=>{ if(o[id]===undefined){ if(x.t==='sav'&&first) id=first.id; else return; } if(ts&&ts<=since[id]) return; o[id]+=v; }); });
    Object.values(d.bills||{}).forEach(p=>{ if(p&&p.paid&&p.acct&&o[p.acct]!==undefined&&(+p.ts||0)>since[p.acct]) o[p.acct]-=(+p.amt||0); });
  }
  return o;
}
function totalSaved(){ const o=bankBalances(); let s=0; savAccts().forEach(b=>{ s+=o[b.id]||0; }); return s; }
function netWorth(){ const o=bankBalances(); let s=0; banks().forEach(b=>{ if(kindOf(b)==='card') return; const pl=kindOf(b)==='inv'?invPL(b,o[b.id]||0):null; s+=pl?pl.v:(o[b.id]||0); }); return s; }
function totals(){
  let inc=0,exp=0,bills=0,sav=0; const byCat={};
  let wd=0,fromSav=0;
  month.tx.forEach(x=>{ if(x.t==='inc') inc+=x.amt; else if(x.t==='exp'){ exp+=x.amt; byCat[x.cat]=(byCat[x.cat]||0)+x.amt; }
    flowsOf(x).forEach(([id,v])=>{ let b=acctById(id); if(!b&&x.t==='sav') b=banks()[0]; if(isSaving(b)){ if(v>0) sav+=v; else wd+=-v; } }); });

  settings.bills.forEach(b=>{ if(!(month.bills[b.id]&&month.bills[b.id].paid)){ pending+=b.amt||0; pendingCount++; } });
  return {inc,exp,bills,sav,wd,fromSav,net:sav-wd,byCat,pending,pendingCount,bal:inc-exp-bills-(sav-wd)};
}

  }

  h+=trendHTML();
  if(month.tx.length||Object.keys(month.bills||{}).length) h+=`<button class="btn ghost" data-report style="margin-top:12px">📄 ${t('rpBtn')}</button>`;

  h+=`<h2>${t('recent')} ${month.tx.length>5?'<button class="link" data-go="list">'+t('seeAll')+'</button>':''}</h2><div class="panel">`;

  h+=`</div>`;
  h+=`<p class="tagline">Smart Finance. Better Life.</p>`;
  const [L,R]=h.split('<!--SPLIT-->');

}

function openSheet(html,mount){

const SUBV=['udhaar','person','goals','zakat','cats'];
let navStack=[], lastMain='home';
function goSub(v){ tab=v; if(location.hash.slice(1)!==v){ navStack.push(v); try{ location.hash=v; }catch(e){} } render(); window.scrollTo(0,0); }
function goBack(fallback){ if(navStack.length&&SUBV.includes(location.hash.slice(1))){ try{ history.back(); return; }catch(e){} } navStack=[]; tab=SUBV.includes(fallback)?fallback:(fallback||lastMain); render(); window.scrollTo(0,0); }
function goMain(t2){ lastMain=t2; tab=t2; const n=navStack.length; navStack=[]; if(n){ try{ history.go(-n); }catch(e){} } render(); window.scrollTo(0,0); }
window.addEventListener('hashchange',()=>{
  const h=location.hash.slice(1);
  if(h==='sheet'){ if(!sheetOpen){ try{ history.back(); }catch(e){} } return; }
  if(sheetOpen) closeSheetUI();
  while(navStack.length&&navStack[navStack.length-1]!==h) navStack.pop();
  if(SUBV.includes(h)){ if(tab!==h){ tab=h; render(); window.scrollTo(0,0); } }
  else if(SUBV.includes(tab)){ tab=lastMain; render(); window.scrollTo(0,0); }
});

    const conv=()=>{ const pv=root.querySelector('#convPrev'); if(!pv) return; const a=parseFloat(String(root.querySelector('#fAmt').value).replace(/,/g,'')), r=parseFloat(root.querySelector('#fRate').value); pv.textContent=(a>0&&r>0)?'= '+fmt(a*r):''; };
    const onCh=e=>{ if(e.target.id==='fCur'){ sync(); x.rate=(settings.rates||{})[x.cc]||''; redraw(); conv(); } };
    const onIn=e=>{ if(e.target.id==='fAmt'||e.target.id==='fRate') conv(); };
    root.addEventListener('change',onCh); root.addEventListener('input',onIn); setTimeout(conv,0);
    const redraw=()=>{ root.innerHTML='<div class="grab"></div>'+draw(); };
    const onClick=e=>{
      const b=e.target.closest('button'); if(!b) return;
      if(b.dataset.type){ sync(); if(x.t!==b.dataset.type){ x.t=b.dataset.type; x.cat=listOf(x.t)[0].k; if(x.t==='sav'&&x.acct&&isSaving(acctById(x.acct))) x.acct=''; if(x.t==='tr'&&!x.to){ const o=banks().find(z=>z.id!==x.acct&&kindOf(z)!=='inv'); x.to=o?o.id:''; } if(x.mzId){ if(x.t==='tr'){ x.to=meezanAcct(); const sa=spendAccts()[0]; x.acct=sa?sa.id:''; } else if(x.t==='inc'){ x.acct=meezanAcct(); } else if(x.t==='sav'){ x.bank=meezanAcct(); x.acct=''; } } } redraw(); }
      else if(b.dataset.cat){ sync(); x.cat=b.dataset.cat; if(x.t==='sav'&&x.cat==='invest'&&invList().length) x.bank=invList()[0].id; else if(x.t==='sav'&&bankOf(x.bank).kind==='inv') x.bank=(bankList()[0]||banks()[0]).id; redraw(); }
      else if(b.dataset.mode){ sync(); x.mode=b.dataset.mode; redraw(); }
      else if(b.dataset.bank){ sync(); x.bank=b.dataset.bank; redraw(); }
      else if(b.dataset.acct!==undefined){ sync(); x.acct=b.dataset.acct; if(x.to===x.acct) x.to=''; redraw(); }
      else if(b.dataset.acctto){ sync(); x.to=b.dataset.acctto; redraw(); }
      else if(b.dataset.goalpick){ sync(); x.goal=b.dataset.goalpick; redraw(); }
      else if(b.hasAttribute('data-ai')){ runAI(); }
      else if(b.hasAttribute('data-mic')){
        if(listening&&stopVoice){ stopVoice(); return; }
        const inp0=root.querySelector('#aiText'); let base=inp0?inp0.value.trim():''; listening=true; aiMsg='';
        stopVoice=startVoice({
          partial:tx=>{ const i=root.querySelector('#aiText'); if(i) i.value=(base+' '+(tx||'')).trim(); },
          final:tx=>{ base=(base+' '+(tx||'').trim()).trim(); const i=root.querySelector('#aiText'); if(i) i.value=base; },
          end:why=>{ if(!alive) return; listening=false; stopVoice=null; aiQ=base; if(base){ redraw(); runAI(); } else { aiMsg=why==='not_granted'?t('vcPerm'):why==='rate_limited'?t('vcBusy'):['stopped','viewer_stopped','hidden','dismissed'].includes(why)?'':t('vcFail'); redraw(); } }
        });
        sync(); aiQ=base; redraw();
      }
      else if(b.hasAttribute('data-del')){
        askConfirm(t('confirmDel'),t('del'),()=>{ month.tx=month.tx.filter(y=>y.id!==existing.id); savDocs['m-'+cur]=month; saveMonth(); render(); toast(t('deleted')); });
      }
      else if(b.hasAttribute('data-save')){
        sync();
        const amt=parseFloat(String(x.amt).replace(/,/g,''));
        if(!(amt>0)){ toast(t('enterAmt')); $('#fAmt').focus(); return; }
        if(!x.date||x.date<mn||x.date>mx){ toast(t('pickDate',monthLabel(cur))); return; }
        const needBank=(x.t==='sav')||(x.t==='exp'&&x.mode==='Savings'&&!x.acct);
        if(x.t==='tr'&&(!x.acct||!x.to||x.acct===x.to)){ toast(t('trSame')); return; }
        let base=amt, oc=null;
        if(x.cc&&x.cc!==mainCur()){ const r=parseFloat(x.rate); if(!(r>0)){ toast(t('rateReq')); return; } base=amt*r; oc={c:x.cc,a:Math.round(amt*100)/100,r}; settings={...settings,rates:{...(settings.rates||{}),[x.cc]:r}}; saveSettings(); }
        const rec={id:existing?existing.id:uid(),t:x.t,amt:Math.round(base*100)/100,cat:x.cat,note:x.note.trim(),date:x.date,mode:x.t==='sav'?'':x.mode};
        if(oc) rec.oc=oc;
        if(x.acct) rec.acct=x.acct; if(x.t==='tr') rec.to=x.to; if(x.acct&&rec.mode==='Savings') rec.mode='';
        if(x.acct&&(x.t==='exp'||x.t==='inc')&&settings.lastAcct!==x.acct){ settings={...settings,lastAcct:x.acct}; saveSettings(); }
        if(needBank) rec.bank=bankOf(x.bank).id;
        if(rec.t==='sav'&&rec.cat==='goal'&&goals().length) rec.goal=goals().some(g=>g.id===x.goal)?x.goal:goals()[0].id;
        if(existing) month.tx=month.tx.map(y=>y.id===rec.id?rec:y); else month.tx=[...month.tx,rec];
        if(x.mzId) mzMarkDone(x.mzId);
        if(!existing&&x.rec){ const rid='r'+uid(); const tpl={id:rid,t:rec.t,amt:rec.amt,cat:rec.cat,note:rec.note,mode:rec.mode,day:+rec.date.slice(8)}; if(rec.bank) tpl.bank=rec.bank; settings={...settings,rec:[...(settings.rec||[]),tpl]}; saveSettings(); month={...month,rec:{...(month.rec||{}),[rid]:rec.id}}; setTimeout(()=>toast(t('recSaved')),2300); }
        savDocs['m-'+cur]=month;
        saveMonth(); closeSheet(); render(); toast(existing?t('updated'):rec.t==='sav'?t('savedSav'):t('savedEntry'));
      }
    };
    let alive=true, stopVoice=null;
    const runAI=async()=>{
      const inp=root.querySelector('#aiText'); aiQ=(inp&&inp.value||'').trim(); if(!aiQ) return;
      if(!sampleFn){ sync(); if(localParse(aiQ,x,mn,mx)){ aiQ=''; aiMsg=t('vcLocal'); } else aiMsg=t('vcNone'); redraw(); return; }
      sync(); aiMsg=t('aiThinking'); redraw();
      const cats=k=>listOf(k).map(c=>c.k+'='+c.n.en).join(', ');
      const prompt=`You turn a short note about one household money entry (Pakistan, rupees; the note may be in Roman Urdu, Urdu or English) into JSON.
Today is ${todayStr}. The entry must be dated between ${mn} and ${mx}; if the note gives no date use ${x.date}. "aaj" means today, "kal" yesterday, "parson" two days ago.
Types: "exp" (expense), "inc" (income), "sav" (money put into savings; use category "withdraw" for money taken out of savings).
Expense categories: ${cats('exp')}
Income categories: ${cats('inc')}
Savings categories: ${cats('sav')}
Accounts (id=name, kind): ${flowAccts().map(b=>b.id+'='+b.name+' ('+kindOf(b)+(kindOf(b)==='bank'?(isSaving(b)?', savings':', spending'):'')+')').join('; ')}. Put the account the money left (expense) or arrived in (income) in "acct". Legacy payment modes for exp and inc: ${MODES.join(', ')} ("Savings" means paid straight from a savings bank; JazzCash and Easypaisa are mobile wallets). Default Cash.
Savings banks (id=name): ${banks().map(b=>b.id+'='+b.name).join(', ')}
Amounts: "4.5k" = 4500, "1 lakh" or "1 lac" = 100000, "1.5 lakh" = 150000.
Words: sauda/sabzi/ration = grocery; petrol/diesel/CNG = fuel; rickshaw/careem/uber/bus = transport; dawai/doctor = health; fees/school = edu; tankhwah/salary = salary; nikale/nikala/withdraw from a bank = type sav with category withdraw; bachat/jama/save into a bank = type sav.
Examples (dates relative to today ${todayStr}):
"aaj Imtiaz se 4500 ka sauda card se" -> {"t":"exp","amt":4500,"cat":"grocery","note":"Imtiaz se sauda","date":"${todayStr}","mode":"Card","bank":""}
"kal petrol 3k cash" -> {"t":"exp","amt":3000,"cat":"fuel","note":"Petrol","date":"<yesterday>","mode":"Cash","bank":""}
"tankhwah 1.5 lakh aayi" -> {"t":"inc","amt":150000,"cat":"salary","note":"Tankhwah","date":"${todayStr}","mode":"Bank","bank":""}
"bank mein 20k bachat daali" -> {"t":"sav","amt":20000,"cat":"bank","note":"Bachat","date":"${todayStr}","mode":"","bank":"<id of the named bank, or the first bank>"}
"bank se 10000 nikale" -> {"t":"sav","amt":10000,"cat":"withdraw","note":"Bank se nikale","date":"${todayStr}","mode":"","bank":"<bank id>"}
Reply with only a JSON object: {"t":"exp|inc|sav","amt":number,"cat":"category key","note":"short note in the same language as the input, max 40 characters","date":"YYYY-MM-DD","mode":"one payment mode","acct":"account id or empty string","bank":"bank id or empty string"}
Note: ${aiQ}`;
      try{
        const res=await sampleFn(prompt,{modelTier:'quick'});
        if(!alive) return;
        const txt=String((res&&res.text)||'').trim();
        let r=null; try{ r=JSON.parse(txt); }catch(_){ const m=txt.match(/\{[\s\S]*\}/); if(m){ try{ r=JSON.parse(m[0]); }catch(__){} } }
        if(r&&typeof r.amt==='string') r.amt=parseFloat(r.amt.replace(/[^\d.]/g,''));
        if(!r||!(+r.amt>0)) throw {code:'parse'};
        const ty=['exp','inc','sav'].includes(r.t)?r.t:'exp';
        x.t=ty; x.amt=String(Math.round(+r.amt*100)/100);
        x.cat=listOf(ty).some(c=>c.k===r.cat)?r.cat:listOf(ty)[0].k;
        if(typeof r.note==='string') x.note=r.note.slice(0,80);
        if(typeof r.date==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&r.date>=mn&&r.date<=mx) x.date=r.date;
        if(MODES.includes(r.mode)) x.mode=r.mode;
        if(r.acct&&acctById(r.acct)&&kindOf(acctById(r.acct))!=='inv') x.acct=r.acct;
        if(r.bank&&banks().some(b=>b.id===r.bank)) x.bank=r.bank;
        aiQ=''; aiMsg=t('aiDone');
      }catch(e){
        if(!alive) return;
        const c=e&&e.code;
        if(c==='cancelled') aiMsg='';
        else if(c==='not_granted') aiMsg=t('aiNoPerm');
        else if(c==='rate_limited') aiMsg=(e.reason==='usage_limit')?t('aiLimit'):t('aiBusy');
        else if(c==='session_expired') aiMsg=t('aiSignIn');
        else if(['sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)) aiMsg=t('aiOff');
        else if(c==='upstream_error') aiMsg=t('aiNet');
        else aiMsg=t('aiFail')+(c&&c!=='parse'?' ('+c+')':'')+(window.ZV_FB&&e&&e.message?' — '+String(e.message).slice(0,160):'');
      }
      redraw();
    };
    const onKey=e=>{ if(e.key==='Enter'&&e.target.id==='aiText'){ e.preventDefault(); runAI(); } };
    root.addEventListener('click',onClick); root.addEventListener('keydown',onKey);
    if(!existing) setTimeout(()=>{ const a=$('#fAmt'); if(a&&!sampleFn) a.focus(); },260);
    return ()=>{ alive=false; if(stopVoice){ try{ stopVoice(); }catch(e){} } root.removeEventListener('click',onClick); root.removeEventListener('keydown',onKey); root.removeEventListener('change',onCh); root.removeEventListener('input',onIn); };
  });
}

function startVoice(h){
  if(dictNS){
    const u1=dictNS.onPartial(e=>h.partial(e.text)), u2=dictNS.onFinal(e=>h.final(e.text));
    const u3=dictNS.onState(e=>{ if(e.state==='idle'){ u1();u2();u3(); if(e.reason==='unavailable'&&lang!=='en') vcLangFail=true; h.end(e.reason); } });
    dictNS.start((lang==='en'||vcLangFail)?{}:{language:'ur'}).catch(err=>{ if(err&&err.code==='unavailable'&&lang!=='en') vcLangFail=true; });
    return ()=>{ dictNS.stop().catch(()=>{}); };
  }
  const r=new SRec(); r.lang=lang==='en'?'en-US':'ur-PK'; r.interimResults=true; r.continuous=false;
  let ended=false; const end=why=>{ if(ended) return; ended=true; h.end(why); };
  r.onresult=e=>{ let fin='',par=''; for(let i=e.resultIndex;i<e.results.length;i++){ const tx=e.results[i][0].transcript; if(e.results[i].isFinal) fin+=tx; else par+=tx; } h.partial(par); if(fin) h.final(fin); };
  r.onerror=ev=>end(ev.error==='not-allowed'?'not_granted':'upstream_error'); r.onend=()=>end('stopped');
  try{ r.start(); }catch(e){ end('upstream_error'); }
  return ()=>{ try{ r.stop(); }catch(e){} };
}

function localParse(q,x,mn,mx){
  const s=' '+q.toLowerCase().replace(/[،,]/g,' ')+' ';
  let a=0; const m=s.match(/(\d+(?:\.\d+)?)\s*(k|hazar|hazaar|thousand|lakh|lac)?\b/);
  if(m){ a=parseFloat(m[1]); const u=m[2]||''; if(u==='k'||u.startsWith('haz')||u==='thousand') a*=1000; if(u==='lakh'||u==='lac') a*=100000; }
  else { const w=s.match(/\b([a-z]+)\s+(sau|hazar|hazaar|lakh|lac)\b/); if(w&&NUMW[w[1]]){ a=NUMW[w[1]]*(w[2]==='sau'?100:w[2].startsWith('haz')?1000:100000); } }
  if(!(a>0)) return false;
  x.amt=String(a);
  if(/tankh|salary|aaya|aayi|aaye|mila\b|mile\b|received|income/.test(s)) x.t='inc'; else if(/bachat|saving|jama ki|jama kiye/.test(s)) x.t='sav'; else x.t='exp';
  const map=[['fuel',/petrol|diesel|cng|fuel/],['grocery',/sauda|sabzi|ration|grocery|imtiaz|chase|naheed/],['food',/khana|restaurant|hotel|food|burger|pizza|biryani/],['transport',/rickshaw|careem|uber|bykea|indrive|yango|bus|taxi/],['health',/dawai|doctor|medicine|hospital|dawa/],['edu',/fees|fee|school|tuition/],['shop',/kapr|shopping|shoes|joote/],['mobile',/load|package|recharge|balance/],['repair',/repair|marammat|mistri/]];
  if(x.t==='exp'){ const f=map.find(z=>z[1].test(s)); x.cat=f?f[0]:'misc'; } else if(x.t==='inc'){ x.cat=/tankh|salary/.test(s)?'salary':/kiraya|rent/.test(s)?'rent':'other'; } else x.cat='bank';
  const ac=banks().find(b=>kindOf(b)!=='inv'&&b.name&&s.includes(b.name.toLowerCase().split(' ')[0])) || (/cash|naqd/.test(s)?banks().find(b=>kindOf(b)==='cash'):null) || (/card/.test(s)?banks().find(b=>kindOf(b)==='card'):null);
  if(ac&&x.t!=='sav') x.acct=ac.id; else if(ac&&x.t==='sav'&&isSaving(ac)) x.bank=ac.id;
  if(/\bkal\b|yesterday/.test(s)){ const d=new Date(todayStr+'T00:00:00'); d.setDate(d.getDate()-1); const ds=d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); if(ds>=mn&&ds<=mx) x.date=ds; }
  x.note=q.trim().slice(0,80); return true;
}

function trendHTML(){
  const [y,m]=cur.split('-').map(Number); const ks=[];

  const data=ks.map(k=>({k,...monthTotals(k===cur?month:savDocs['m-'+k])}));

  const W=340,H=160,base=128,top=30,gw=W/6,bw=11;

  data.forEach((d,i)=>{ const cx=gw*i+gw/2; const hi=(d.inc/max)*(base-top), ho=(d.out/max)*(base-top), hs=(d.sav/max)*(base-top);
    const xi=cx-bw*1.5-5, xo=cx-bw/2, xs=cx+bw/2+5;

function allDocs(){ return {...savDocs,['m-'+cur]:month}; }
function goalAuto(g){ const a=+g.auto||0; if(!a||!/^\d{4}-\d{2}$/.test(g.autoFrom||'')) return 0; const [fy,fm]=g.autoFrom.split('-').map(Number); const [ny,nm]=todayStr.slice(0,7).split('-').map(Number); const n=(ny-fy)*12+(nm-fm)+1; return n>0?n*a:0; }

  const au=goalAuto(g); if(!au) return s2; const tg=+g.target||0; return tg?Math.max(s2,Math.min(tg,s2+au)):s2+au; }
function goalAvg(g){ let [y,m]=todayStr.slice(0,7).split('-').map(Number); const docs=allDocs(); let s2=0;
  for(let i=0;i<3;i++){ const d=docs['m-'+y+'-'+pad(m)]; ((d&&d.tx)||[]).forEach(x=>{ if(x.t==='sav'&&x.goal===g.id&&x.cat!=='withdraw') s2+=+x.amt||0; }); m--; if(m<1){m=12;y--;} }
  const started=g.auto&&g.autoFrom&&g.autoFrom<=todayStr.slice(0,7)?(+g.auto||0):0;
  return s2/3+(started||(g.auto&&g.autoFrom?+g.auto:0)); }

const gmQuery=after=>'from:('+BANKS_MAIL.map(b=>b[0]).join(' OR ')+') (credit OR credited OR received OR deposit OR deposited) after:'+after;
const meezanAcct=()=>{ const s2=settings.mzAcct&&acctById(settings.mzAcct); if(s2) return s2.id; const m=banks().find(b=>/meezan/i.test(b.name)&&kindOf(b)!=='inv'); return m?m.id:''; };
function gmBankOf(fromHdr){ const f=String(fromHdr||'').toLowerCase(); return BANKS_MAIL.find(b=>f.includes('@'+b[0])||f.includes('.'+b[0]))||null; }
function gmAcctFor(bk){ if(!bk) return ''; const kw=bk[2]; const a=banks().find(b=>kindOf(b)!=='inv'&&kindOf(b)!=='card'&&b.name.toLowerCase().includes(kw)); return a?a.id:''; }
function gmParse(id,snippet,subject,fromHdr,ts,since){
  if(ts&&ts<=since) return null;
  const txt=(String(subject||'')+' '+String(snippet||'')); const low=txt.toLowerCase();
  if(!/credit|received|deposit/.test(low)) return null;
  if(/debit|debited|purchase|withdraw|spent|paid to|sent to|transferred to|bill payment|otp/.test(low)&&!/credit transaction|has been credited|credited to your|received in your|received to your/.test(low)) return null;
  const am=txt.match(/(?:PKR|Rs\.?|RS\.?)\s*([\d,]+(?:\.\d{1,2})?)/i); if(!am) return null;
  const amt=parseFloat(am[1].replace(/,/g,'')); if(!(amt>0)) return null;
  const f1=txt.match(/Beneficiary Account:\s*:?\s*(.+?)\s+Branch/i), f2=txt.match(/(?:received from|from)\s+([A-Za-z][A-Za-z .\-]{2,40}?)(?:\s+(?:on|at|via|to|ref|account)\b|[.,]|$)/i);
  const from=String((f1&&f1[1])||(f2&&f2[1])||'').trim().slice(0,40);
  const bk=gmBankOf(fromHdr)||(/meezan/i.test(fromHdr)?BANKS_MAIL[0]:null);
  const dt=new Date(ts||Date.now());
  return {id,amt,from,bank:bk?bk[1]:'Bank',acct:gmAcctFor(bk),date:dt.getFullYear()+'-'+pad(dt.getMonth()+1)+'-'+pad(dt.getDate())};
}
function gmAfter(since){ const d0=new Date(since-86400000); return d0.getFullYear()+'/'+pad(d0.getMonth()+1)+'/'+pad(d0.getDate()); }
function gmSetPending(out){

}
/* Claude version: via Gmail connector */
async function checkMeezan(){
  if(window.ZV_FB){ gmAutoWeb(); return; }
  if(mzChecked||Store.mode!=='cloud') return; mzChecked=true;
  if(!(window.claude&&typeof claude.use==='function')) return;
  let mcp=null; try{ mcp=await claude.use('mcp'); }catch(e){} if(!mcp) return;
  const since=+settings.mzSince||MZ_START;
  const stop=['not_granted','consent_required','server_not_connected','server_not_found','needs_reauth','not_in_manifest','capability_disabled','capability_removed','blocked_by_policy'];
  try{
    const r=await mcp.callTool('Gmail','search_threads',{query:gmQuery(gmAfter(since)),pageSize:25},{cache:false});
    const th=(r&&r.payload&&r.payload.threads)||[]; const ids=[];
    th.forEach(x=>(x.messages||[]).forEach(m=>{ if(m&&m.id&&!ids.includes(m.id)) ids.push(m.id); }));
    const done=new Set(settings.mzDone||[]); const out=[];
    for(const id of ids.filter(i=>!done.has(i)).slice(0,15)){
      let g=null; try{ g=await mcp.callTool('Gmail','get_message',{messageId:id,messageFormat:'MINIMAL'},{cache:{staleTime:86400000,gcTime:86400000}}); }catch(e){ if(e&&stop.includes(e.code)) return; continue; }
      const p=g&&g.payload; if(!p||typeof p!=='object') continue;
      const fromHdr=(p.sender||'')+' '+((p.addressDisplayNames||[]).map(a=>a.emailAddress).join(' '));
      const it=gmParse(id,p.snippet,p.subject,fromHdr,+p.internalDate||Date.parse(p.date)||0,since); if(it) out.push(it);
    }
    gmSetPending(out);
  }catch(e){}
}
/* Web / app version: Google token with extra scopes */
const GS_GMAIL='https://www.googleapis.com/auth/gmail.readonly', GS_CAL='https://www.googleapis.com/auth/calendar.events';
function gTokGet(scopes){ try{ const o=JSON.parse(localStorage.getItem('zv:gtok')||'null'); if(o&&o.uid===(Store.uid||'')&&o.exp>Date.now()+60000&&scopes.every(s=>(o.scopes||[]).includes(s))) return o.tok; }catch(e){} return null; }
async function gTokEnsure(scopes,interactive){
  const have=gTokGet(scopes); if(have) return have; if(!interactive) return null;
  let prev=[]; try{ const o=JSON.parse(localStorage.getItem('zv:gtok')||'null'); if(o&&o.uid===Store.uid&&o.exp>Date.now()) prev=o.scopes||[]; }catch(e){}
  const all=[...new Set([...prev,...scopes])];
  const pr=new firebase.auth.GoogleAuthProvider(); all.forEach(s=>pr.addScope(s));
  const u=firebase.auth().currentUser; if(u&&u.email) pr.setCustomParameters({login_hint:u.email});
  const r=await u.reauthenticateWithPopup(pr);
  const tok=r&&r.credential&&r.credential.accessToken; if(!tok) throw new Error('no token');
  try{ localStorage.setItem('zv:gtok',JSON.stringify({tok,exp:Date.now()+3300*1000,scopes:all,uid:Store.uid})); }catch(e){}
  return tok;
}
async function gFetch(url,tok,opts){ const r=await fetch(url,{...(opts||{}),headers:{Authorization:'Bearer '+tok,'Content-Type':'application/json',...((opts&&opts.headers)||{})}}); if(r.status===401){ try{ localStorage.removeItem('zv:gtok'); }catch(e){} throw Object.assign(new Error('auth'),{code:401}); } if(!r.ok){ let m=''; try{ m=(await r.json()).error.message; }catch(e){} throw Object.assign(new Error(m||('HTTP '+r.status)),{code:r.status}); } return r.status===204?null:r.json(); }
async function gmScanWeb(interactive){
  if(gmBusy) return; gmBusy=true;
  try{
    const tok=await gTokEnsure([GS_GMAIL],interactive); if(!tok){ gmBusy=false; render(); return; }
    if(!settings.gmOn||!settings.gmSince) { settings={...settings,gmOn:true,gmSince:settings.gmSince||(Date.now()-3*86400000)}; saveSettings(); }
    const since=+settings.gmSince;
    const L=await gFetch('https://gmail.googleapis.com/gmail/v1/users/me/messages?maxResults=25&q='+encodeURIComponent(gmQuery(gmAfter(since))),tok);
    const done=new Set(settings.mzDone||[]); const out=[];
    for(const m of ((L&&L.messages)||[]).filter(x=>!done.has(x.id)).slice(0,20)){
      try{ const g=await gFetch('https://gmail.googleapis.com/gmail/v1/users/me/messages/'+m.id+'?format=metadata&metadataHeaders=From&metadataHeaders=Subject',tok);
        const H=n=>{ const h=((g.payload&&g.payload.headers)||[]).find(x=>x.name.toLowerCase()===n); return h?h.value:''; };
        const it=gmParse(m.id,g.snippet,H('subject'),H('from'),+g.internalDate||0,since); if(it) out.push(it);
      }catch(e){ if(e.code===401) throw e; }
    }
    settings={...settings,gmLast:Date.now()}; saveSettings();
    gmSetPending(out); if(interactive) toast(out.length?t('gmFound',out.length):t('gmNone'));
  }catch(e){ if(interactive) toast(gErr(e)); }
  gmBusy=false; render();
}
function gErr(e){ const m=String(e&&e.message||''); if(/popup-closed|cancelled-popup/i.test(m)||/popup-closed/.test(e&&e.code||'')) return t('gCancel'); if(/access_denied|not.*(test|verified)|403/i.test(m)||e.code===403) return t('gDenied'); return t('gFail')+(m?' ('+m.slice(0,80)+')':''); }
function gmAutoWeb(){ if(mzChecked) return; mzChecked=true; if(settings.gmOn&&gTokGet([GS_GMAIL])) gmScanWeb(false); }
function gmNeedsTap(){ return !!(window.ZV_FB&&settings.gmOn&&!gTokGet([GS_GMAIL])&&!gmBusy); }

/* ---------- Google Calendar bill reminders ---------- */
let calBusy=false;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function gCall(url,tok,opts){ for(let k=0;k<4;k++){ try{ return await gFetch(url,tok,opts); }catch(e){ if((e.code===403||e.code===429)&&/rate|quota|limit/i.test(String(e.message||''))&&k<3){ await sleep(1500*(k+1)); continue; } throw e; } } }
async function calSync(){
  if(calBusy) return; calBusy=true; render();
  try{
    const tok=await gTokEnsure([GS_CAL],true);
    const tz=Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Karachi';
    const map={...(settings.calEvents||{})}; const days=+settings.alertDays||3;
    const base='https://www.googleapis.com/calendar/v3/calendars/primary/events';
    const tmin=new Date(Date.now()-400*86400000).toISOString();
    const L=await gCall(base+'?q='+encodeURIComponent('Zenvora')+'&maxResults=250&singleEvents=false&showDeleted=false&timeMin='+encodeURIComponent(tmin),tok);
    const mine=((L&&L.items)||[]).filter(ev=>(ev.extendedProperties&&ev.extendedProperties.private&&ev.extendedProperties.private.zv)||/\(Zenvora\)\s*$/.test(ev.summary||''));
    const keep=new Set();
    for(const b of settings.bills){
      const sum='🧾 '+billName(b)+' (Zenvora)';
      const ex=mine.find(ev=>ev.id===map[b.id])||mine.find(ev=>ev.extendedProperties&&ev.extendedProperties.private&&ev.extendedProperties.private.zvBill===b.id&&!keep.has(ev.id))||mine.find(ev=>ev.summary===sum&&!keep.has(ev.id));
      if(ex){ map[b.id]=ex.id; keep.add(ex.id); } else delete map[b.id];
    }
    for(const ev of mine){ if(!keep.has(ev.id)){ try{ await gCall(base+'/'+encodeURIComponent(ev.id),tok,{method:'DELETE'}); }catch(e){ if(e.code===401) throw e; } await sleep(150); } }
    let n=0;
    for(const b of settings.bills){
      const day=Math.min(28,Math.max(1,+b.due||1)); const now=new Date(); let y=now.getFullYear(), m=now.getMonth(); if(now.getDate()>day){ m++; if(m>11){ m=0; y++; } }
      const ds=y+'-'+pad(m+1)+'-'+pad(day);
      const body={summary:'🧾 '+billName(b)+' (Zenvora)',description:(b.amt?t('approx',fmt(b.amt))+'\n':'')+'Zenvora',start:{dateTime:ds+'T10:00:00',timeZone:tz},end:{dateTime:ds+'T10:30:00',timeZone:tz},recurrence:['RRULE:FREQ=MONTHLY;BYMONTHDAY='+day],reminders:{useDefault:false,overrides:[{method:'popup',minutes:days*1440},{method:'popup',minutes:0}]},extendedProperties:{private:{zv:'1',zvBill:b.id}}};
      if(map[b.id]){ await gCall(base+'/'+encodeURIComponent(map[b.id]),tok,{method:'PUT',body:JSON.stringify(body)}); }
      else { const ev=await gCall(base,tok,{method:'POST',body:JSON.stringify(body)}); map[b.id]=ev.id; }
      n++; settings={...settings,calEvents:{...map}}; saveSettings(); await sleep(250);
    }
    settings={...settings,calEvents:map,calSynced:Date.now(),calCount:n}; saveSettings(); toast(t('calDone',n));
  }catch(e){ toast(gErr(e)); }
  calBusy=false; render();
}

/* ---------- zakat ---------- */
function zakatCalc(){
  const z=settings.zakat||{}; const bb=bankBalances();
  const banksAmt=flowAccts().filter(b=>kindOf(b)!=='card').reduce((s2,b)=>s2+Math.max(0,bb[b.id]||0),0);
  const cardDebt=flowAccts().reduce((s2,b)=>s2+Math.max(0,-(bb[b.id]||0)),0);
  const invAmt=invList().reduce((s2,b)=>{ const pl=invPL(b,bb[b.id]||0); return s2+Math.max(0,pl?pl.v:(bb[b.id]||0)); },0);
  const U=udTotals(); const incUd=z.incUd!==false;
  const n=k=>+z[k]||0;
  const assets=banksAmt+invAmt+(incUd?U.get:0)+n('cash')+n('goldTola')*n('goldRate')+n('silverTola')*n('silverRate')+n('other');
  const liab=U.give+n('debts')+cardDebt;
  const net=Math.max(0,assets-liab);
  const basis=z.nb==='gold'?'gold':'silver';
  const nisab=basis==='gold'?(n('goldRate')?7.5*n('goldRate'):0):(n('silverRate')?52.5*n('silverRate'):0);
  return {banksAmt,invAmt,udGet:U.get,udGive:U.give,incUd,assets,liab,net,nisab,basis,goldVal:n('goldTola')*n('goldRate'),silverVal:n('silverTola')*n('silverRate'),due:nisab&&net>=nisab?Math.round(net*0.025):0};
}

  h+=`<h2>${t('zLiab')}</h2><div class="panel">`+(Z.udGive?auto(t('zUdGive'),Z.udGive):'')+inp('debts',t('zDebts'))+`</div>`;

function aiErr(e){
  const c=e&&e.code;
  if(c==='not_granted') return t('aiNoPerm');
  if(c==='rate_limited') return (e.reason==='usage_limit')?t('aiLimit'):t('aiBusy');
  if(c==='session_expired') return t('aiSignIn');
  if(['sampling_disabled','not_declared','capability_disabled','capability_removed'].includes(c)) return t('aiOff');
  if(c==='upstream_error') return t('aiNet');
  return t('aiFail')+(c?' ('+c+')':'')+(window.ZV_FB&&e&&e.message?' — '+String(e.message).slice(0,160):'');
}
function aiContext(){

    d.tx.forEach(x=>{ if(x.t==='exp'){ const n=catOf(x.cat,'exp').n.en; byCat[n]=(byCat[n]||0)+(+x.amt||0); } });

  return out.join('\n');
}

/* ---------- PIN lock ---------- */
let unlocked=false, lockMode=null, pinBuf='', pinFirst='', lastHidden=0, settingsLoaded=false, lockErr='';
async function pinHash(pin){
  const raw='zenvora:'+(Store.uid||'local')+':'+pin;
  try{ const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(raw)); return Array.from(new Uint8Array(h)).map(b=>b.toString(16).padStart(2,'0')).join(''); }
  catch(e){ let x=5381; for(let i=0;i<raw.length;i++) x=((x<<5)+x+raw.charCodeAt(i))|0; return 'f'+(x>>>0).toString(16); }
}
function lockTitle(){ return {unlock:t('pinEnter'),set1:t('pinNew'),set2:t('pinAgain'),verifyChange:t('pinCurrent'),verifyRemove:t('pinCurrent')}[lockMode]; }
function drawLock(shake){
  const el=$('#lock'); const logo=document.querySelector('.logo');
  const keys=['1','2','3','4','5','6','7','8','9','','0','⌫'];
  el.innerHTML=`${logo?`<img src="${logo.getAttribute('src')}" alt="">`:''}
    <h3>${esc(lockTitle())}</h3>
    <div class="dots ${shake?'shake':''}">${[0,1,2,3].map(i=>`<i class="${i<pinBuf.length?'on':''}"></i>`).join('')}</div>
    <div class="err" role="alert">${esc(lockErr)}</div>
    <div class="pad">${keys.map(k=>k?`<button data-k="${k}" aria-label="${k==='⌫'?'Delete':k}">${k}</button>`:'<button class="blank" tabindex="-1" aria-hidden="true"></button>').join('')}</div>
    ${lockMode==='unlock'?`<p class="sub">${esc(t('pinForgot'))}</p>`:`<button class="cancel" data-k="x">${esc(t('cancel'))}</button>`}`;
}
function showLock(mode){ lockMode=mode; pinBuf=''; lockErr=''; if(mode==='set1') pinFirst=''; $('#lock').hidden=false; drawLock(); }
function hideLock(){ lockMode=null; pinBuf=''; lockErr=''; $('#lock').hidden=true; }
async function pinDone(){
  const pin=pinBuf;
  if(lockMode==='set1'){ pinFirst=pin; lockMode='set2'; pinBuf=''; lockErr=''; drawLock(); return; }
  if(lockMode==='set2'){
    if(pin!==pinFirst){ lockMode='set1'; pinFirst=''; pinBuf=''; lockErr=t('pinMismatch'); drawLock(true); return; }
    const hsh=await pinHash(pin); settings={...settings,pinHash:hsh}; saveSettings();
    try{localStorage.setItem('mh:pin','1');}catch(e){}
    unlocked=true; hideLock(); toast(t('pinSetT')); return;
  }
  if(!settingsLoaded){ pinBuf=''; lockErr=t('pinWait'); drawLock(); return; }
  const ok=settings.pinHash && (await pinHash(pin))===settings.pinHash;
  if(!ok){ pinBuf=''; lockErr=t('pinWrong'); drawLock(true); return; }
  if(lockMode==='unlock'){ unlocked=true; hideLock(); return; }
  if(lockMode==='verifyChange'){ showLock('set1'); return; }
  if(lockMode==='verifyRemove'){ const ns={...settings}; ns.pinHash=null; settings=ns; saveSettings(); try{localStorage.removeItem('mh:pin');}catch(e){} hideLock(); toast(t('pinRemoved')); }
}
function pinKey(k){
  if(!lockMode) return;
  if(k==='x'){ hideLock(); return; }
  if(k==='⌫'){ pinBuf=pinBuf.slice(0,-1); drawLock(); return; }
  if(pinBuf.length>=4) return;
  pinBuf+=k; lockErr=''; drawLock();
  if(pinBuf.length===4) setTimeout(pinDone,120);
}
$('#lock').addEventListener('click',e=>{ const b=e.target.closest('[data-k]'); if(b) pinKey(b.dataset.k); });
document.addEventListener('keydown',e=>{ if(!lockMode) return; if(/^[0-9]$/.test(e.key)) pinKey(e.key); else if(e.key==='Backspace') pinKey('⌫'); });
function onSettingsLoaded(){
  settingsLoaded=true;
  const has=!!settings.pinHash;
  try{ has?localStorage.setItem('mh:pin','1'):localStorage.removeItem('mh:pin'); }catch(e){}
  if(has && !unlocked && !lockMode) showLock('unlock');
  if(!has && lockMode==='unlock') hideLock();
  checkMeezan();
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ lastHidden=Date.now(); return; }
  if(settings.pinHash && unlocked && !lockMode && Date.now()-lastHidden>60000){ unlocked=false; closeSheet(); showLock('unlock'); }
});

async function saveLocal(blob,filename){

  if(P&&P.Filesystem&&P.Share){
    const b64=await new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(',')[1]); r.onerror=rej; r.readAsDataURL(blob); });
    const w=await P.Filesystem.writeFile({path:filename,data:b64,directory:'CACHE'});
    try{ await P.Share.share({title:filename,url:w.uri,dialogTitle:filename}); }catch(e){}
    return;
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1500); toast(t('fileSaved'));
}

function openReportRange(){
  const [cy,cm]=cur.split('-').map(Number);
  const last=(y,m)=>{ while(m<1){m+=12;y--;} return [y,m]; };
  const ld=(y,m)=>y+'-'+pad(m)+'-'+pad(new Date(y,m,0).getDate());
  const [ly,lm]=last(cy,cm-1); const [ty,tm]=last(cy,cm-2);
  const presets=[['prThis',cur+'-01',ld(cy,cm)],['prLast',ly+'-'+pad(lm)+'-01',ld(ly,lm)],['pr3',ty+'-'+pad(tm)+'-01',ld(cy,cm)],['prYear',cy+'-01-01',cy+'-12-31']];
  let from=presets[0][1], to=presets[0][2], kind='pdf';
  const draw=()=>`<h3>📄 ${t('rpRangeTitle')}</h3>
    <div class="chips">${presets.map(p=>`<button class="chip" data-pr="${p[0]}" aria-pressed="${from===p[1]&&to===p[2]}">${t(p[0])}</button>`).join('')}</div>
    <div class="rgrid"><div class="field" style="margin:0"><label for="rFrom">${t('rpFrom')}</label><input type="date" id="rFrom" value="${from}"></div><div class="field" style="margin:0"><label for="rTo">${t('rpTo')}</label><input type="date" id="rTo" value="${to}"></div></div>
    <div class="field"><label>${t('rpFmt')}</label><div class="seg" role="group"><button data-kind="pdf" aria-pressed="${kind==='pdf'}">${t('fmtPdf')}</button><button data-kind="png" aria-pressed="${kind==='png'}">${t('fmtPng')}</button></div><p class="hint" style="margin:6px 2px 0">${kind==='pdf'?t('fmtPdfHint'):t('fmtPngHint')}</p></div>
    <div class="actions"><button class="btn pri" data-mk>${kind==='pdf'?'📄':'🖼️'} ${t('rpMake')}</button></div>`;
  openSheet(draw(),root=>{
    const h2=e=>{ const el=e.target.closest('button'); if(!el) return;
      if(el.dataset.pr){ const p=presets.find(z=>z[0]===el.dataset.pr); from=p[1]; to=p[2]; root.innerHTML='<div class="grab"></div>'+draw(); return; }
      if(el.dataset.kind){ from=root.querySelector('#rFrom').value||from; to=root.querySelector('#rTo').value||to; kind=el.dataset.kind; root.innerHTML='<div class="grab"></div>'+draw(); return; }
      if(el.hasAttribute('data-mk')){ from=root.querySelector('#rFrom').value; to=root.querySelector('#rTo').value; if(!from||!to||from>to){ toast(t('rpBadRange')); return; } closeSheet(); makeReport(from,to,kind); }
    };
    const ch=e=>{ if(e.target.id==='rFrom'||e.target.id==='rTo'){ from=root.querySelector('#rFrom').value; to=root.querySelector('#rTo').value; root.querySelectorAll('[data-pr]').forEach(b=>{ const p=presets.find(z=>z[0]===b.dataset.pr); b.setAttribute('aria-pressed',from===p[1]&&to===p[2]); }); } };
    root.addEventListener('click',h2); root.addEventListener('change',ch);
    return ()=>{ root.removeEventListener('click',h2); root.removeEventListener('change',ch); };
  });
}
let reportBusy=false;
async function makeReport(from,to,kind){
  if(reportBusy) return; reportBusy=true; toast(t('rpMaking'));
  let el=null;
  try{
    const dlP=(window.claude&&claude.use)?claude.use('downloads').catch(()=>null):Promise.resolve(null);
    await loadScript('html2canvas.min.js');
    if(kind!=='png') await loadScript('jspdf.umd.min.js');
    el=document.createElement('div'); el.className='rp'; el.dir=lang==='ur'?'rtl':'ltr'; el.innerHTML=reportHTML(from,to); document.body.appendChild(el);
    try{ await document.fonts.ready; }catch(e){}
    await new Promise(r=>setTimeout(r,200));
    const SC=2; const top0=el.getBoundingClientRect().top;
    const brks=[...el.querySelectorAll('[data-brk]')].map(n=>Math.round((n.getBoundingClientRect().top-top0)*SC)).filter(v=>v>0).sort((a,b)=>a-b);
    const canvas=await window.html2canvas(el,{scale:SC,backgroundColor:'#ffffff',windowWidth:794,logging:false});
    el.remove(); el=null;
    const base=(from.slice(0,7)===to.slice(0,7)&&from.slice(8)==='01')?'Zenvora-'+from.slice(0,7):'Zenvora-'+from+'_to_'+to;
    if(kind==='png'){
      const png=await new Promise(res=>canvas.toBlob(res,'image/png')); const fn=base+'.png'; const d0=await dlP;
      if(d0){ try{ const r=await d0.save({filename:fn,data:png}); if(r&&r.status==='saved') toast(t('fileSaved')); }catch(e){ if(!['cancelled','dismissed','declined'].includes(e&&e.code)) toast(t('dlFail')+' ('+((e&&e.code)||'?')+')'); } }
      else await saveLocal(png,fn);
      return;
    }
    const pdf=new window.jspdf.jsPDF({unit:'pt',format:'a4',compress:true});
    const pw=pdf.internal.pageSize.getWidth(), ph=pdf.internal.pageSize.getHeight(), M=30;
    const pxPerPt=canvas.width/pw, capPx=Math.floor((ph-2*M)*pxPerPt);
    let y=0, first=true;
    while(y<canvas.height-2){
      let end=Math.min(y+capPx,canvas.height);
      if(end<canvas.height){ const c2=brks.filter(b=>b>y+capPx*0.4&&b<=end); if(c2.length) end=c2[c2.length-1]; }
      const hpx=end-y; const pc=document.createElement('canvas'); pc.width=canvas.width; pc.height=hpx;
      const cx=pc.getContext('2d'); cx.fillStyle='#fff'; cx.fillRect(0,0,pc.width,hpx); cx.drawImage(canvas,0,y,canvas.width,hpx,0,0,canvas.width,hpx);
      if(!first) pdf.addPage(); pdf.addImage(pc.toDataURL('image/jpeg',0.9),'JPEG',0,M,pw,hpx/pxPerPt); first=false; y=end;
    }
    const pages=pdf.internal.getNumberOfPages();
    for(let i=1;i<=pages;i++){ pdf.setPage(i); pdf.setFontSize(8); pdf.setTextColor(140); pdf.text(i+' / '+pages,pw/2,ph-12,{align:'center'}); }
    const blob=pdf.output('blob'); const fname=base+'.pdf';
    const d=await dlP;
    if(d){ try{ const r=await d.save({filename:fname,data:blob}); if(r&&r.status==='saved') toast(t('fileSaved')); }
      catch(e){ const c=e&&e.code;
        if(['cancelled','dismissed','declined'].includes(c)) {}
        else if(['extension_not_enabled','rejected_extension','too_large'].includes(c)){
          try{ const png=await new Promise(res=>canvas.toBlob(res,'image/png')); const r2=await d.save({filename:fname.replace(/\.pdf$/,'.png'),data:png}); if(r2&&r2.status==='saved') toast(t('rpPng')); }
          catch(e2){ if(!['cancelled','dismissed','declined'].includes(e2&&e2.code)) toast(t('dlFail')+' ('+((e2&&e2.code)||'?')+')'); }
        }
        else toast(t('dlFail')+' ('+(c||'?')+')'); } }
    else await saveLocal(blob,fname);
  }catch(e){ toast(t('rpFail')+(e&&(e.message||e.type)?' ('+String(e.message||e.type).slice(0,60)+')':'')); }
  finally{ if(el) el.remove(); reportBusy=false; }
}

async function setupCsv(){
  const b=$('#csvBtn'); if(!b) return;

  $('#csvBtn').hidden=false;
  $('#csvBtn').onclick=async()=>{
    const q=s=>'"'+String(s==null?'':s).replace(/"/g,'""')+'"';
    const lines=[t('csvH').map(q).join(',')];
    [...month.tx].sort((a,b)=>a.date.localeCompare(b.date)).forEach(x=>lines.push([x.date,typeName(x.t),cn(catOf(x.cat,x.t)),x.note,acctLabel(x),x.amt].map(q).join(',')));
    settings.bills.forEach(bl=>{ const p=month.bills[bl.id]; if(p&&p.paid) lines.push([p.date||'',t('bill'),billName(bl),'','',p.amt].map(q).join(',')); });
    if(!d){
      try{ await saveLocal(new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv'}),'hisaab-'+cur+'.csv'); }catch(e){ toast(t('dlFail')); }
      return;
    }
    try{ const r=await d.save({filename:'hisaab-'+cur+'.csv',data:'\ufeff'+lines.join('\n')}); if(r&&r.status==='saved') toast(t('fileSaved')); }
    catch(e){ if(e&&e.code!=='cancelled'&&e.code!=='dismissed') toast(t('dlFail')); }
  };
}

function applyNumInput(i){
  const v=parseFloat(String(i.value).replace(/[^\d.]/g,''))||0;
  if(i.hasAttribute('data-open')){
    if((+settings.savOpen||0)===v) return false;
    settings={...settings,savOpen:v>0?v:0}; saveSettings(); return 'open';
  }
  if(i.hasAttribute('data-goal')){
    if((+settings.goal||0)===v) return false;
    settings={...settings,goal:v>0?v:0}; saveSettings(); return 'goal';
  }
  if(!i.dataset.budget) return false;
  const k=i.dataset.budget;
  if((+settings.budgets[k]||0)===v) return false;
  const nb={...settings.budgets}; if(v>0) nb[k]=v; else delete nb[k];
  settings={...settings,budgets:nb}; saveSettings(); return 'budget';
}
